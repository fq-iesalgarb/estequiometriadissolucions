<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glass Glow / Reflection -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Outer Atomic Orbit 1 -->
  <ellipse cx="64" cy="68" rx="48" ry="16" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="10 6" transform="rotate(-30 64 68)" opacity="0.85"/>
  <circle cx="24" cy="46" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Outer Atomic Orbit 2 -->
  <ellipse cx="64" cy="68" rx="48" ry="16" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8 5" transform="rotate(30 64 68)" opacity="0.75"/>
  <circle cx="100" cy="46" r="4.5" fill="#f43f5e"/>

  <!-- Erlenmeyer Flask Base Shadow -->
  <ellipse cx="64" cy="100" rx="32" ry="8" fill="#022c22" opacity="0.5"/>

  <!-- Flask Liquid -->
  <path d="M 44 76 L 36 92 C 34 96 37 100 42 100 L 86 100 C 91 100 94 96 92 92 L 84 76 Q 64 72 44 76 Z" fill="url(#liquidGrad)"/>

  <!-- Bubbles inside flask -->
  <circle cx="56" cy="84" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="68" cy="78" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="74" cy="88" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="62" cy="66" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="66" cy="54" r="2.5" fill="#38bdf8" opacity="0.9"/>

  <!-- Flask Glass Body Outline -->
  <path d="M 54 32 L 74 32 M 58 32 L 58 50 L 89 93 C 92 98 88 104 82 104 L 46 104 C 40 104 36 98 39 93 L 70 50 L 70 32" 
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glass Highlight Line -->
  <path d="M 44 91 L 62 56" fill="none" stroke="url(#glassGlow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkle Star at top right -->
  <path d="M 96 24 L 98 30 L 104 32 L 98 34 L 96 40 L 94 34 L 88 32 L 94 30 Z" fill="#facc15"/>
</svg>